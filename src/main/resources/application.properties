spring.application.name=talent

spring.mvc.problemdetails.enabled=true

# Aplicación
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ucu_talent_database_dev}}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.url=${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ucu_talent_database_dev}}
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Cloud Run usa PORT; localmente usa APP_PORT o 8080.
server.port=${PORT:${APP_PORT:8080}}

# JWT (auth stateless) (JWT_SECRET)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:240}

# CORS (no se puede usar "*" junto con allowCredentials)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Rutas de la documentacion OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.show-actuator=true

# Actuator monitoring
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=always

# Conexion a Google Cloud Storage
spring.cloud.gcp.storage.project-id=${GCP_PROJECT_ID}
gcs.bucket-name=${GCP_BUCKET_NAME}

# Desactiva la autoconfiguracion nativa de Cloud SQL Connector.
# La conexion a Cloud SQL en modo hosted se hace via el Cloud SQL Auth Proxy
# como un Postgres normal, no usando el socket factory de Spring Cloud GCP.
spring.cloud.gcp.sql.enabled=false