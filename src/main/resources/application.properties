spring.application.name=talent

spring.mvc.problemdetails.enabled=true

# Aplicación
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ucu_talent_database_dev}}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.url=${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ucu_talent_database_dev}}
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Cloud Run usa PORT; localmente usa APP_PORT o 8080.
server.port=${PORT:${APP_PORT:8080}}

# JWT (auth stateless) (JWT_SECRET)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:240}

# Rate limiting de login (Bucket4j + Caffeine, in-memory)
security.rate-limit.login.enabled=${LOGIN_RATE_LIMIT_ENABLED:true}
security.rate-limit.login.per-email.capacity=${LOGIN_RATE_LIMIT_EMAIL_CAPACITY:5}
security.rate-limit.login.per-email.window-seconds=${LOGIN_RATE_LIMIT_EMAIL_WINDOW_SECONDS:60}
security.rate-limit.login.per-ip.capacity=${LOGIN_RATE_LIMIT_IP_CAPACITY:20}
security.rate-limit.login.per-ip.window-seconds=${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:60}
security.rate-limit.login.cache-max-size=${LOGIN_RATE_LIMIT_CACHE_MAX_SIZE:50000}
security.rate-limit.login.cache-expire-minutes=${LOGIN_RATE_LIMIT_CACHE_EXPIRE_MINUTES:120}
# Bloqueo progresivo (estilo iOS): 1er excedente = 30s, 2do = 3min, 3ro = 15min, siguientes se quedan en 15min.
security.rate-limit.login.lockout-schedule-seconds=${LOGIN_RATE_LIMIT_LOCKOUT_SCHEDULE_SECONDS:30,180,900}
security.rate-limit.login.lockout-reset-minutes=${LOGIN_RATE_LIMIT_LOCKOUT_RESET_MINUTES:1440}

# Rate limiting de alta de cuentas (POST /user). Cache y bloqueo totalmente independientes del login.
# Mas de 3 cuentas distintas por IP en 60s ya se considera abuso: bloqueo minimo de 1 dia,
# escalando a 3 y despues 7 dias si reincide (incluso si reincide recien al dia siguiente: el
# contador de reincidencia dura 30 dias, mucho mas que el ultimo escalon de castigo).
security.rate-limit.signup.enabled=${SIGNUP_RATE_LIMIT_ENABLED:true}
security.rate-limit.signup.per-email.capacity=${SIGNUP_RATE_LIMIT_EMAIL_CAPACITY:3}
security.rate-limit.signup.per-email.window-seconds=${SIGNUP_RATE_LIMIT_EMAIL_WINDOW_SECONDS:60}
security.rate-limit.signup.per-ip.capacity=${SIGNUP_RATE_LIMIT_IP_CAPACITY:3}
security.rate-limit.signup.per-ip.window-seconds=${SIGNUP_RATE_LIMIT_IP_WINDOW_SECONDS:60}
security.rate-limit.signup.cache-max-size=${SIGNUP_RATE_LIMIT_CACHE_MAX_SIZE:50000}
security.rate-limit.signup.cache-expire-minutes=${SIGNUP_RATE_LIMIT_CACHE_EXPIRE_MINUTES:120}
security.rate-limit.signup.lockout-schedule-seconds=${SIGNUP_RATE_LIMIT_LOCKOUT_SCHEDULE_SECONDS:86400,259200,604800}
security.rate-limit.signup.lockout-reset-minutes=${SIGNUP_RATE_LIMIT_LOCKOUT_RESET_MINUTES:43200}

# CORS (no se puede usar "*" junto con allowCredentials)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Rutas de la documentacion OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.show-actuator=true
server.forward-headers-strategy=framework

# Actuator monitoring
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=always