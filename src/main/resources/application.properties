spring.application.name=talent

spring.mvc.problemdetails.enabled=true


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:talent}
spring.datasource.username=${POSTGRES_USER:talent_user}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_only}

spring.jpa.hibernate.ddl-auto=validate

server.port=${APP_PORT:8080}

# Rutas de la documentacion OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
