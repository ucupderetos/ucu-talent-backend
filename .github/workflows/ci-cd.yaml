name: CI/CD Backend Java+Maven

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

env:
  PROJECT_ID: reto-universitario-2026
  REGION: us-central1
  SERVICE: api-dev
  IMAGE: us-central1-docker.pkg.dev/reto-universitario-2026/backend-dev/api

jobs:
  # -- Continuos Integration
  unit-test-backend:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Give execute permission to mvnw
        run: chmod +x mvnw
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: ./mvnw test

  docker-build-check-backend:
    name: Check dockerfile builds
    needs: unit-test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t temp-image:ci-check .
  
  # -- Continuos deployment
  
  build-and-deploy:
    name: Build, push y deploy a Cloud Run
    needs: [unit-test-backend, docker-build-check-backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
     contents: read

    steps:
     - uses: actions/checkout@v4

     - name: Autenticar contra Google Cloud
       uses: google-github-actions/auth@v2
       with: 
             credentials_json: '${{secrets.GCP_SA_KEY}}'

     - uses: google-github-actions/setup-gcloud@v2

     - name: Configurar Docker para Artifact Registry
       run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

     - name: Build de la imagen
       run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .

     - name: Push a Artifact Registry
       run: docker push ${{ env.IMAGE }}:${{ github.sha }}

     - name: Deploy a Cloud Run
       uses: google-github-actions/deploy-cloudrun@v2
       with:
         service: ${{ env.SERVICE }}
         region: ${{ env.REGION }}
         image: ${{ env.IMAGE }}:${{ github.sha }}
         env_vars: |
           APP_PORT=${{ vars.APP_PORT }}
           POSTGRES_DB=${{ vars.POSTGRES_DB }}
           POSTGRES_USER=${{ secrets.POSTGRES_USER }}
           POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
           FLYWAY_USER=${{ secrets.FLYWAY_USER }}
           FLYWAY_PASSWORD=${{ secrets.FLYWAY_PASSWORD }}
           CLOUD_SQL_INSTANCE=${{ vars.CLOUD_SQL_INSTANCE }}
           JWT_SECRET=${{ secrets.JWT_SECRET }}
         flags: '--min-instances=0 --max-instances=2 --cpu=1 --memory=512Mi --allow-unauthenticated --add-cloudsql-instances=${{ vars.CLOUD_SQL_INSTANCE }}'


