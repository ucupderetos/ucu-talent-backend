name: CI Backend Java+Maven

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  unit-test-backend:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: ./mvnw test

  docker-build-check-backend:
    name: Check dockerfile builds
    needs: unit-test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t temp-image:ci-check .
